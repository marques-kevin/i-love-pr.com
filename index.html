<!doctype html>
<html lang="en" data-theme="ilovepr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="Self-hosted GitHub pull request analytics. No backend — your PAT stays in your browser."
    />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>iLovePR — GitHub PR analytics</title>
    <script>
      try {
        var theme = localStorage.getItem('ilovepr.theme')
        var allowed =
          ' ilovepr light dark cupcake bumblebee emerald corporate synthwave retro cyberpunk valentine halloween garden forest aqua lofi pastel fantasy wireframe black luxury dracula cmyk autumn business acid lemonade night coffee winter dim nord sunset caramellatte abyss silk '
        if (theme && allowed.indexOf(' ' + theme + ' ') !== -1) {
          document.documentElement.setAttribute('data-theme', theme)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
